# Bayes'd Misfits — MindRL Challenge runtime + model configuration.
#
# The evaluator parses this file and passes it to ``Agent.__init__(config)``.
# ``runtime`` and ``evaluation`` are challenge-required; ``model`` holds the
# hyperparameters your agent reads in ``__init__``. The keys under ``model.*``
# below are the offline-fitted Dual-Alpha + Sticky RL parameters (asymmetric
# learning rates, choice stickiness, softmax inverse-temperature).

runtime:
  random_seed: 2026
  device: cpu
  execution_type: local_python
  requires_gpu: false
  requires_external_api: false

model:
  name: dual_alpha_sticky_rl
  type: cognitive_rl_model
  rl_alpha_pos: 0.380
  rl_alpha_neg: 0.763
  sticky: 0.126
  beta: 8.331
  initial_q: 0.5

evaluation:
  allow_online_state_updates: true